name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/DeployAI.Tests/DeployAI.Tests.csproj

      - name: Validate Railway GraphQL operations against schema
        run: dotnet build src/DeployAI.Providers.Railway.GraphQL/DeployAI.Providers.Railway.GraphQL.csproj --no-restore

      - name: Build
        run: dotnet build src/DeployAI.Tests/DeployAI.Tests.csproj --no-restore

      - name: Test
        run: dotnet test src/DeployAI.Tests/DeployAI.Tests.csproj --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --browsers=ChromeHeadless --watch=false

      - name: Build
        run: npm run build
