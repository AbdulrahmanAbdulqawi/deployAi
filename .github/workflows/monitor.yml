name: Monitor

# Runs on a schedule (independent of pushes) and captures a quick health snapshot:
# build status, frontend build status, open issues/PRs, latest CI run, and a
# lightweight code-smell scan (TODO/FIXME/console.log/debugger leftovers).
# Publishes the result to the dev-monitor dashboard repo.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  REPO_KEY: deployai

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Backend build
        id: backend
        continue-on-error: true
        run: |
          dotnet restore src/DeployAI.Tests/DeployAI.Tests.csproj
          dotnet build src/DeployAI.Tests/DeployAI.Tests.csproj --no-restore 2>&1 | tee build.log
          warnings=$(grep -c "warning " build.log || true)
          echo "warnings=${warnings:-0}" >> "$GITHUB_OUTPUT"

      - name: Frontend build
        id: frontend
        continue-on-error: true
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Quick code-smell scan
        id: smells
        run: |
          count=$(grep -rEn "TODO|FIXME|console\.log|debugger" --include="*.ts" --include="*.cs" --include="*.html" \
            --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj --exclude-dir=dist . | wc -l)
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"

      - name: Repo signals (issues, PRs, latest CI run)
        id: signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_issues=$(gh issue list --state open --json id --jq 'length' || echo 0)
          open_prs=$(gh pr list --state open --json id --jq 'length' || echo 0)
          ci_run=$(gh run list --workflow=build.yml -L 1 --json conclusion,htmlUrl,createdAt || echo '[]')
          ci_conclusion=$(echo "$ci_run" | jq -r '.[0].conclusion // "unknown"')
          ci_url=$(echo "$ci_run" | jq -r '.[0].htmlUrl // ""')
          echo "open_issues=${open_issues:-0}" >> "$GITHUB_OUTPUT"
          echo "open_prs=${open_prs:-0}" >> "$GITHUB_OUTPUT"
          echo "ci_conclusion=${ci_conclusion}" >> "$GITHUB_OUTPUT"
          echo "ci_url=${ci_url}" >> "$GITHUB_OUTPUT"

      - name: Assemble result
        id: result
        run: |
          backend_ok=${{ steps.backend.outcome == 'success' }}
          frontend_ok=${{ steps.frontend.outcome == 'success' }}
          cat > result.json <<JSON
          {
            "repo": "deployAi",
            "key": "${REPO_KEY}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "backend_build_ok": ${backend_ok},
            "frontend_build_ok": ${frontend_ok},
            "build_warnings": ${{ steps.backend.outputs.warnings }},
            "code_smells": ${{ steps.smells.outputs.count }},
            "open_issues": ${{ steps.signals.outputs.open_issues }},
            "open_prs": ${{ steps.signals.outputs.open_prs }},
            "ci_conclusion": "${{ steps.signals.outputs.ci_conclusion }}",
            "ci_url": "${{ steps.signals.outputs.ci_url }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          cat result.json

      - name: Publish to dev-monitor
        env:
          GH_TOKEN: ${{ secrets.DEV_MONITOR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DEV_MONITOR_TOKEN secret not set yet - skipping publish. Add it in repo Settings > Secrets and variables > Actions."
            exit 0
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/AbdulrahmanAbdulqawi/dev-monitor.git" dev-monitor
          cd dev-monitor
          mkdir -p data
          cp ../result.json "data/${REPO_KEY}.json"
          touch "data/${REPO_KEY}-history.jsonl"
          jq -c . ../result.json >> "data/${REPO_KEY}-history.jsonl"
          tail -n 200 "data/${REPO_KEY}-history.jsonl" > /tmp/trimmed.jsonl && mv /tmp/trimmed.jsonl "data/${REPO_KEY}-history.jsonl"
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update ${REPO_KEY} status ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
