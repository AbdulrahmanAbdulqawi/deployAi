query ServiceStatus($serviceId: String!) {
  service(id: $serviceId) {
    serviceInstances {
      edges {
        node {
          environmentId
          domains {
            serviceDomains {
              domain
              syncStatus
            }
          }
          latestDeployment {
            status
            url
            createdAt
          }
        }
      }
    }
  }
}
