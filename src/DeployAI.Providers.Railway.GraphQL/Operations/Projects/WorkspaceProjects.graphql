query WorkspaceProjects($workspaceId: String!) {
  workspace(workspaceId: $workspaceId) {
    projects {
      edges {
        node {
          id
          name
          environments {
            edges {
              node {
                id
                name
              }
            }
          }
          services {
            edges {
              node {
                id
                name
              }
            }
          }
        }
      }
    }
  }
}
