<article
  class="project-card u-card"
  [class.project-card--deploying]="isDeploying"
  tabindex="0"
  role="link"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="$event.preventDefault(); onCardClick()">
  <div class="project-card__icon">
    @if (hasLogo) {
      <app-app-logo [logoKey]="project.logoKey ?? null" variant="picker" />
    }
  </div>

  <div class="project-card__body">
    <h3 class="project-card__title">{{ project.name }}</h3>

    <div class="project-card__status">
      @if (project.latestDeployment) {
        <app-status-badge
          [status]="project.latestDeployment.status"
          [live]="project.latestDeployment.status === 'in_progress'"
          [dotWithLabel]="true" />
      } @else {
        <app-status-badge status="idle" [dotWithLabel]="true" />
      }
    </div>

    @if (updatedLabel) {
      <p class="project-card__updated">{{ updatedLabel }}</p>
    }
  </div>

  <div class="project-card__footer">
    <div class="project-card__actions">
      @if (canFix) {
        <app-ui-button
          variant="secondary"
          icon="code"
          (click)="onFixClick($event)">
          Fix
        </app-ui-button>
      }
      <app-ui-button
        variant="secondary"
        [disabled]="publishing"
        [loading]="publishing"
        icon="upload"
        (click)="onPublishClick($event)">
        Publish
      </app-ui-button>
    </div>
  </div>
</article>
