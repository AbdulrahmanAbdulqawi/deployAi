<article
  class="project-card u-card"
  [class.project-card--deploying]="isDeploying"
  tabindex="0"
  role="link"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="$event.preventDefault(); onCardClick()">
  <div class="project-card__orb-stage" aria-hidden="true">
    <div class="project-card__orb" [class]="'project-card__orb--' + orbTone()">
      <span class="project-card__orb-highlight"></span>
      @if (hasLogo) {
        <span class="project-card__orb-logo">
          <app-app-logo [logoKey]="project.logoKey ?? null" variant="orb" />
        </span>
      }
      @if (isDeploying) {
        <span class="project-card__orb-ring"></span>
      }
    </div>
    <span class="project-card__orb-shadow"></span>
  </div>

  <div class="project-card__body">
    <div class="project-card__title">
      <h3 class="u-title-lg">{{ project.name }}</h3>
      <div class="project-card__badge">
        @if (project.latestDeployment) {
          <app-status-badge [status]="project.latestDeployment.status" [live]="project.latestDeployment.status === 'in_progress'" />
        } @else {
          <app-status-badge status="idle" />
        }
      </div>
      <p class="project-card__repo">
        <span class="u-code-sm">{{ project.githubRepoFullName }}</span>
      </p>
    </div>

    <div class="project-card__footer">
      <div class="project-card__actions">
        @if (canFix) {
          <app-ui-button
            variant="secondary"
            icon="code"
            (click)="onFixClick($event)">
            Fix
          </app-ui-button>
        }
        <app-ui-button
          variant="secondary"
          [disabled]="publishing"
          [loading]="publishing"
          icon="upload"
          (click)="onPublishClick($event)">
          Publish
        </app-ui-button>
      </div>
    </div>
  </div>
</article>
