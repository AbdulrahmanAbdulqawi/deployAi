<article class="project-card u-card">
  <div class="project-card__header">
    <div class="project-card__title">
      <h3>{{ project.name }}</h3>
      <p class="meta u-text-muted">{{ project.githubRepoFullName }} · {{ targetSummary }}</p>
    </div>
    @if (project.latestDeployment) {
      <app-status-badge [status]="project.latestDeployment.status" [live]="project.latestDeployment.status === 'in_progress'" />
    } @else {
      <app-status-badge status="idle" />
    }
  </div>
  <div class="project-card__actions">
    <app-ui-button variant="primary" [disabled]="publishing" [loading]="publishing" icon="upload" (click)="publish.emit(project.id)">
      Publish
    </app-ui-button>
    <app-ui-dropdown [items]="moreItems" (select)="onMoreAction($event)" />
  </div>
</article>
