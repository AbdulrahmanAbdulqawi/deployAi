<article class="card">
  <div class="header">
    <div>
      <h3>{{ project.name }}</h3>
      <p class="meta">{{ project.githubRepoFullName }} · {{ providerNames }}</p>
    </div>
    @if (project.latestDeployment) {
      <app-status-badge [status]="project.latestDeployment.status" />
    } @else {
      <app-status-badge status="idle" />
    }
  </div>
  <div class="actions">
    <button type="button" class="primary" (click)="publish.emit(project.id)">Publish</button>
    <button type="button" class="secondary" (click)="open.emit(project.id)">Open</button>
    <button type="button" class="secondary" (click)="history.emit(project.id)">Past updates</button>
  </div>
</article>
