<span
  class="badge"
  [class]="statusClass"
  [class.badge--dot]="showDot"
  [attr.title]="label"
  [attr.aria-label]="showDot ? label : null"
  [attr.role]="isLive ? 'status' : null"
  [attr.aria-live]="isLive ? 'polite' : null">
  @if (showDot) {
    <span class="badge__dot" aria-hidden="true"></span>
  } @else {
    @if (statusClass !== 'live') {
      <app-ui-icon [name]="iconName" size="sm" [statusClass]="iconStatusClass" />
    }
    {{ label }}
  }
</span>
