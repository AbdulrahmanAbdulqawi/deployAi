<div class="backdrop" role="dialog" aria-modal="true" [attr.aria-label]="title">
  <div class="dialog u-card">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="actions">
      <app-ui-button variant="secondary" icon="x" (click)="cancel.emit()">{{ cancelLabel }}</app-ui-button>
      <app-ui-button variant="primary" [icon]="destructive ? 'trash' : 'check'" (click)="confirm.emit()">
        {{ confirmLabel }}
      </app-ui-button>
    </div>
  </div>
</div>
