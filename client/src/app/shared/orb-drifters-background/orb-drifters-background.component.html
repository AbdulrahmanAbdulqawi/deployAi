<div class="orb-drifters" aria-hidden="true">
  @for (drifter of drifters; track $index) {
    <div
      #drifterRef
      class="orb-drifters__orb {{ toneClass(drifter.tone) }} {{ depthClass(drifter.depth) }}"
      [style.width.rem]="drifter.sizeRem"
      [style.height.rem]="drifter.sizeRem">
      <span class="orb-drifters__highlight"></span>
      <span class="orb-drifters__shadow"></span>
    </div>
  }
</div>
