<div class="shell" [class.shell--collapsed]="sidebarCollapsed()">
  <aside class="sidebar">
    <div class="sidebar__top">
      <a routerLink="/dashboard" class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__label">DeployAI</span>
      </a>

      <nav aria-label="Primary">
        <a routerLink="/dashboard" routerLinkActive="active" title="Your apps">
          <app-ui-icon name="folder" size="sm" />
          <span class="nav-label">Your apps</span>
        </a>
        <a routerLink="/fleet" routerLinkActive="active" title="Health">
          <app-ui-icon name="check" size="sm" />
          <span class="nav-label">Health</span>
        </a>
        <a routerLink="/settings" routerLinkActive="active" title="Settings">
          <app-ui-icon name="settings" size="sm" />
          <span class="nav-label">Settings</span>
        </a>
      </nav>
    </div>

    <div class="sidebar__bottom">
      <button
        type="button"
        class="collapse-toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        <app-ui-icon [name]="sidebarCollapsed() ? 'arrow-right' : 'arrow-left'" size="sm" statusClass="muted" />
        <span class="nav-label">Collapse</span>
      </button>

      <button type="button" class="sign-out-btn" (click)="signOut()" title="Sign out">
        <span class="avatar" aria-hidden="true"></span>
        <span class="nav-label">Sign out</span>
      </button>
    </div>
  </aside>

  <main>
    <router-outlet />
  </main>
</div>
