<div class="shell">
  <div class="u-ambient-glow" aria-hidden="true"></div>
  @if (theme.showOrbDrifters()) {
    <app-orb-drifters-background />
  }
  @if (theme.showOrbSnake()) {
    <app-orb-snake-background />
  }

  <header class="topbar">
    <div class="topbar__start">
      <a routerLink="/dashboard" class="brand">DeployAI</a>
      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">Apps</a>
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
      </nav>
    </div>
    <div class="topbar__actions">
      <a routerLink="/settings/appearance" class="appearance-link" routerLinkActive="appearance-link--active">Appearance</a>
      <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme.mode() === 'dark') {
          <app-ui-icon name="sun" size="sm" statusClass="muted" />
        } @else {
          <app-ui-icon name="moon" size="sm" statusClass="muted" />
        }
      </button>
      <button type="button" class="sign-out-btn u-label-caps" (click)="signOut()">Sign out</button>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
