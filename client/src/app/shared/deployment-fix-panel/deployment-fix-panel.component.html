<section class="fix-panel u-glass-panel">
  <div class="fix-panel__header">
    <div class="fix-panel__icon" aria-hidden="true">
      <app-ui-icon name="alert" size="sm" statusClass="warning" />
    </div>
    <div>
      <h3 class="fix-panel__title">Build error detected</h3>
      <p class="fix-panel__summary">{{ failureAnalysis().summary }}</p>
    </div>
  </div>

  <app-deployment-repo-changes-flow
    [owner]="owner()"
    [repo]="repo()"
    [projectId]="projectId()"
    [baseBranch]="baseBranch()"
    mergeMode="fix"
    contextTitle="Error sent to Claude"
    contextHint="This excerpt from the build log is sent to Claude as part of the fix request. Confirm it reflects the failure you expect before generating a fix."
    [contextLines]="claudeErrorLines()"
    generateLabel="Generate fix with Claude"
    mergeSuccessMessage="Fix merged. Publish again to deploy the updated code."
    [runGenerate]="runGenerate"
    (fixComplete)="fixComplete.emit()"
  />
</section>
