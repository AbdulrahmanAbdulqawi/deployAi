<button
  [type]="type"
  class="ui-btn"
  [class.ui-btn--primary]="variant === 'primary'"
  [class.ui-btn--secondary]="variant === 'secondary'"
  [class.ui-btn--quiet]="variant === 'quiet'"
  [class.ui-btn--success]="tone === 'success'"
  [class.ui-btn--block]="block"
  [disabled]="disabled || loading">
  @if (displayIcon) {
    <app-ui-icon [name]="displayIcon" size="sm" />
  }
  <ng-content />
</button>
