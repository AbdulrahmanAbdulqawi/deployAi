<section class="panel">
  <button type="button" class="toggle" (click)="expanded = !expanded">
    {{ expanded ? 'Hide activity' : 'Show activity' }}
  </button>
  @if (expanded) {
    <div class="log" aria-live="polite">
      @for (line of lines; track line.sequence + line.providerName) {
        <div class="line">
          <span class="provider">{{ line.providerName }}</span>
          <span>{{ line.line }}</span>
        </div>
      } @empty {
        <p class="placeholder">Getting your app ready…</p>
      }
    </div>
  }
</section>
